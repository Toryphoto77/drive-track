org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 注意：这里不要写 org.gradle.offline=true。本机沙箱的离线构建由
# 构建脚本在 GRADLE_USER_HOME/init.d/offline.gradle 里临时开启，
# 构建完即删；写死在 gradle.properties 里会让用户自己电脑上的
# 构建也强制离线、下载不到依赖而失败。
kotlin.internal.collectFUSMetrics=false
kotlin.daemon.jvm.options=-Djava.net.preferIPv4Stack=true
kotlin.compiler.execution.strategy=in-process
# v1.5.1：Kotlin 编译改进程内执行。沙箱会拦截回环 TCP，Kotlin
# 编译守护进程（RMI）连不上自己的注册表，compileKotlin 报
# "Failed connecting to the daemon in 4 retries"（2026-11-08
# 1.5.1 首编即因此失败；此前 Kotlin 源码没动、任务被缓存跳过，
# 所以 1.5.0 没撞上）。in-process 不走网络，只慢一点。
