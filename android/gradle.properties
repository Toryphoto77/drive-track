org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# 工程目录含中文（…\DriveTrack 工程文件\…）。AGP 默认会拒绝非 ASCII 路径，
# 直接报 "Your project path contains non-ASCII characters" 并中止构建。
# AGP 8+ 在 Windows 上已能正确处理 Unicode 路径，这里显式关掉该检查。
android.overridePathCheck=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 注意：这里不要写 org.gradle.offline=true。本机沙箱的离线构建由
# 构建脚本在 GRADLE_USER_HOME/init.d/offline.gradle 里临时开启，
# 构建完即删；写死在 gradle.properties 里会让用户自己电脑上的
# 构建也强制离线、下载不到依赖而失败。
kotlin.internal.collectFUSMetrics=false
kotlin.daemon.jvm.options=-Djava.net.preferIPv4Stack=true
kotlin.compiler.execution.strategy=in-process
# v1.6.3：本机关闭 Kotlin 增量编译。增量缓存（caches-jvm）在编译收尾时
# 会被本机文件保护/杀软占用，报 "Could not close incremental caches"，
# 导致 release 构建失败；关掉后每次全量编译该插件，稳定通过。
kotlin.incremental=false
# v1.6.3：分 ABI 出包（--split-per-abi）时，AGP 默认给 versionCode 加
# 1000×ABI 偏移（arm64 会变成 2068），会让在线更新比较永久失效。
# 这里强制沿用 pubspec 的 versionCode，三个包都是 68。
force-version-code-ignoring-abi=true
# v1.5.1：Kotlin 编译改进程内执行。沙箱会拦截回环 TCP，Kotlin
# 编译守护进程（RMI）连不上自己的注册表，compileKotlin 报
# "Failed connecting to the daemon in 4 retries"（2026-11-08
# 1.5.1 首编即因此失败；此前 Kotlin 源码没动、任务被缓存跳过，
# 所以 1.5.0 没撞上）。in-process 不走网络，只慢一点。
