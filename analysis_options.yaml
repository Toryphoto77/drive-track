# flutter_lints enabled with legacy-noise rules turned off so `flutter analyze`
# stays clean on this large pre-existing tree. Re-enable gradually when cleaning
# old files; new code should still follow the remaining rules.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**

linter:
  rules:
    # Mass legacy noise (see 2026-11-09 enhance analyze log: 140 infos).
    dangling_library_doc_comments: false
    unintended_html_in_doc_comment: false
    unnecessary_const: false
    unnecessary_brace_in_string_interps: false
    unnecessary_string_interpolations: false
    no_leading_underscores_for_local_identifiers: false
    curly_braces_in_flow_control_structures: false
    prefer_initializing_formals: false
    prefer_function_declarations_over_variables: false
    prefer_final_fields: false
    prefer_interpolation_to_compose_strings: false
    avoid_unnecessary_containers: false
    use_full_hex_values_for_flutter_colors: false
    use_build_context_synchronously: false
    # Style volume on this tree.
    avoid_print: false
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    prefer_const_declarations: false
    prefer_const_constructors_in_immutables: false
    sized_box_for_whitespace: false
    sort_child_properties_last: false
