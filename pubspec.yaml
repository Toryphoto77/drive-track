name: drive_track
description: "驰迹 DriveTrack：极简风轨迹记录 App（汽车 / 摩托 / 骑行）"
publish_to: 'none'
version: 1.5.0+55

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # 图标删减后只留方向盘 / 方格旗两项。被删三图的 PNG 文件仍在磁盘
    # （桌面启动图标本身就是红赛车 @mipmap/ic_launcher_red，不可删），
    # 仅从 Flutter assets 移除，不再打包进 App。
    - assets/app_icon_steering.png
    - assets/app_icon_checkered.png
    # 赛道库种子数据（manifest + 包 JSON，随仓库走；缺失时库页回落内置迁移包）。
    - data/tracks-manifest.json
    - data/packages/
  fonts:
    - family: DriveTrackDisplay
      fonts:
        - asset: assets/fonts/DriveTrackDisplay.ttf
    - family: DriveTrackSans
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
