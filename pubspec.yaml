name: drive_track
description: "驰迹 DriveTrack：极简风轨迹记录 App（汽车 / 摩托 / 卡丁车）"
publish_to: 'none'
version: 1.6.3+68

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # v1.6.0：手机内直接把 HUD 字幕轨烧进视频（不再只靠电脑 ffmpeg）。
  # 选 _video 变体：LGPL 构建，含 libass / fontconfig / freetype（ass 滤镜），
  # 不含 GPL 的 x264/x265（避免整包被 GPL 传染）。编码走 Android 硬件
  # MediaCodec（h264_mediacodec），不可用时回落 mpeg4。要求 Android API 24+。
  ffmpeg_kit_flutter_new_video: ^2.5.8
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # 图标只留方向盘 / 方格旗两项；废弃的 red/rb17/valkyrie/app_icon.png
    # 已从 assets 删除。桌面 alias 用的 mipmap 仍保留。
    - assets/app_icon_steering.png
    - assets/app_icon_checkered.png
    # 赛道库种子数据（manifest + 包 JSON，随仓库走；缺失时库页回落内置迁移包）。
    - data/tracks-manifest.json
    - data/packages/
  fonts:
    - family: DriveTrackDisplay
      fonts:
        - asset: assets/fonts/DriveTrackDisplay.ttf
    - family: DriveTrackSans
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
