name: drive_track
description: "驰迹 DriveTrack：极简风轨迹记录 App（汽车 / 摩托 / 骑行）"
publish_to: 'none'
version: 1.5.5+60

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # 图标只留方向盘 / 方格旗两项；废弃的 red/rb17/valkyrie/app_icon.png
    # 已从 assets 删除。桌面 alias 用的 mipmap 仍保留。
    - assets/app_icon_steering.png
    - assets/app_icon_checkered.png
    # 赛道库种子数据（manifest + 包 JSON，随仓库走；缺失时库页回落内置迁移包）。
    - data/tracks-manifest.json
    - data/packages/
  fonts:
    - family: DriveTrackDisplay
      fonts:
        - asset: assets/fonts/DriveTrackDisplay.ttf
    - family: DriveTrackSans
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
