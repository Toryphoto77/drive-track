; 驰迹自研 GPS+IMU 记录模块固件（ESP32-S3）
;
; 目标板：ESP32-S3-DevKitC-1（或同芯片自定义板）
; 若你的板子不是 DevKitC-1，只需改 board = 为对应板卡名（见 docs/FLASHING.md）。
;
; 常用命令：
;   pio run                编译
;   pio run -t upload      编译并烧录
;   pio device monitor     查看串口日志

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; USB CDC 作为串口输出（S3 原生 USB 口可直接看日志）
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    adafruit/Adafruit BMP3XX Library@^2.1.0
    adafruit/Adafruit Unified Sensor@^1.1.14
